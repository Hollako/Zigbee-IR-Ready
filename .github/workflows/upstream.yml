name: Check upstream protocol changes
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_upstream.py
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-protocol-revision
          path: upstream-report.json
