name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  encoders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: chmod +x custom_components/tuya_ir_bridge/bin/ir-engine-*
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check custom_components/tuya_ir_bridge/www/panel.js
      - run: node --check custom_components/tuya_ir_bridge/www/manager.js
      - run: node --check custom_components/tuya_ir_bridge/www/editor.js
      - run: node --check custom_components/tuya_ir_bridge/www/remote_card.js
      - run: node --test tests/panel.test.cjs
